<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../CSS/public.css">
    <link rel="stylesheet" href="../CSS/popup.css">
    <script src="https://kit.fontawesome.com/d19fdaba43.js" crossorigin="anonymous"></script>
    <script src="../JS/popup.js" defer></script>
    <title>Layout Popup Window</title>
</head>
<body>
<div class="popup_overlay">
    <div class="popup">

        <!-- 왼쪽 이미지 -->
        <div class="popup_left">
            <img src="../IMAGE/popup1.webp" alt="#">
        </div>

        <!-- 오른쪽 -->
        <div class="popup_right">

            <!-- 전체선택 -->
            <div>
                <div class="check">
                    <label class="check_all">
                        <input type="checkbox" id="checkAll">
                        <span class="check_box"></span>
                        <span>전체선택</span>
                    </label>

                    <button type="button" class="close_btn">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <!-- 상품 리스트 -->
            <div class="product_list">

                <!-- 상품 1 -->
                <div class="product">

                    <label class="product_top">
                        <input type="checkbox" class="item_check">
                        <span class="check_box"></span>

                        <img src="../IMAGE/popup2.webp" alt="">
                        <div class="info">
                            <b>에샤페 벨크로 메리제인 초코</b>
                            <span>BROWN, BROWN, BROWN</span>
                            <strong>99,900원</strong>
                        </div>
                    </label>

                    <!-- 아코디언 -->
                    <details class="accordion">
                        <summary>
                            <span>사이즈 선택</span>
                            <i class="fa-solid fa-angle-down"></i>
                        </summary>

                        <div class="size_box">
                            <button>230</button>
                            <button>235</button>
                            <button>240</button>
                            <button>245</button>
                            <button>250</button>
                            <button>255</button>
                        </div>
                    </details>

                </div>

                <!-- 상품 2 -->
                <div class="product">

                    <label class="product_top">
                        <input type="checkbox" class="item_check">
                        <span class="check_box"></span>

                        <img src="../IMAGE/popup3.webp" alt="">
                        <div class="info">
                            <b>에샤페 벨크로 메리제인</b>
                            <span>BLACK, BLACK, BLACK</span>
                            <strong>99,000원</strong>
                        </div>
                    </label>

                    <details class="accordion">
                        <summary>
                            <span>사이즈 선택</span>
                            <i class="fa-solid fa-angle-down"></i>
                        </summary>

                        <div class="size_box">
                            <button>230</button>
                            <button>235</button>
                            <button>240</button>
                            <button>245</button>
                        </div>
                    </details>

                </div>

            </div>

            <!-- 금액 -->
            <div class="total">
                <div class="price">
                    <span>주문금액</span>
                    <b>0원</b>
                </div>

                <!-- 버튼 -->
                <button class="cart_btn">장바구니 담기</button>
            </div>

        </div>
    </div>
</div>

</body>
</html>
