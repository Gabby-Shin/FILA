<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>cart</title>
    <link rel="stylesheet" href="../../CSS/user/cart.css">
    <script src="https://kit.fontawesome.com/d19fdaba43.js" crossorigin="anonymous"></script>
    <script src="../../JS/cart.js"></script>
</head>
<body>
    <section class="header">
        <div class="header_container">
            <img src="../../IMAGE/LOGO/images.png" alt="logo">
            <i class="fa-regular fa-user"></i>
        </div>
    </section>
    <section class="cart_header">
        <h2>장바구니</h2>
        <div class="cart_select_area">
            <label>
                <input type="checkbox" id="selectAll">
                전체선택
            </label>
        </div>
    </section>

    <form action="#" class="cart_container">
       <section class="cart_list">

            <section class="cart_item">
                <input type="checkbox" class="cart_check">
                <div class="image_container">
                  <img src="../../IMAGE/f6.webp"/>
                </div>
                <div class="cart_item_info">
                    <div class="cart_item_info_header">
                        <span>AIRism 코튼오버사이즈크루넥T(5부)</span>
                        <div class="cancle">
                            <i class="fa-solid fa-x"></i>
                        </div>
                    </div>
                    <div class="size">
                        <div>컬러: 09Black</div>
                        <div>사이즈: MEN M</div>
                    </div>
                    <div class="price">14,900원</div>
                    <div class="info">
                        <div>리사이클 소재,</div>
                        <div>UNISEX</div>
                    </div>
                    <div class="quantity">
                        <button type="button"><i class="fa-solid fa-minus"></i></button>
                        <input type="text" value="1">
                        <button type="button"><i class="fa-solid fa-plus"></i></button>
                    </div>
                </div>
            </section>
           <section class="cart_item">
               <input type="checkbox" class="cart_check">

               <div class="image_container">
                   <img src="../../IMAGE/f5.webp"/>
               </div>
               <div class="cart_item_info">
                   <div class="cart_item_info_header">
                       <span>AIRism 코튼T</span>
                       <div class="cancle">
<!--                           <i class="fa-regular fa-heart"></i>-->
                           <i class="fa-solid fa-x"></i>
                       </div>
                   </div>
                   <div class="size">
                       <div>컬러: 00White</div>
                       <div>사이즈: WOMEN M</div>
                   </div>
                   <div class="price">14,900원</div>
                   <div class="quantity">
                       <button type="button"><i class="fa-solid fa-minus"></i></button>
                       <input type="text" value="1">
                       <button type="button"><i class="fa-solid fa-plus"></i></button>
                   </div>
               </div>
           </section>
            <section class="cart_summary">
                <section class="cart_info">
                    <div class="cart_detail">
                        <h3>주문 상세내역</h3>
                        <div>2 제품</div>
                    </div>
                    <div class="cart_total">
                        <div>제품 합계</div>
                        <div>29,800원</div>
                    </div>
                    <div class="cart_delivery">
                        <div>배송비</div>
                        <div>3,000원</div>
                    </div>
                    <div class="cart_detail">
                        <h3>총 결제금액</h3>
                        <div>32,800원</div>
                    </div>
                    <div class="cart_total">
                        <div>세금(VAT)</div>
                        <div>2,710원</div>
                    </div>
                </section>
                <div class="coupon">
                    <div>
                    <i class="fa-solid fa-ticket"></i>
                    쿠폰
                    </div>
                    <i class="fa-solid fa-angle-right"></i>
                </div>
                <div class="cart_footer">
                    <div>10,100원 추가 구매 시, 무료배송</div>
                    <a href="#">추천 제품 보기 <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
                    <div>[주문하기]버튼을 누른 후 30분간 재고가 임시 확보되므로, 빠른 결제 부탁드립니다.</div>
                    <button type="button">주문하기</button>
                </div>
            </section>
        </section>
    </form>
</body>
</html>
